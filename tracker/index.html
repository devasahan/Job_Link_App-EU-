<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Application Tracker</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f3f5f4;--ink:#10222a;--mute:#5f7078;--line:#dfe5e3;--acc:#0f766e;--accl:#e1f2ef;--card:#fff;--col:#e8edec;--onacc:#fff;--hov:#b9c4c1;--warnbg:#fdf1e3;--warnfg:#8a4b0f;--okbg:#e2f3e6;--okfg:#1d6a2c;--danger:#b42318;--shade:rgba(16,34,42,.5)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1a1f;--ink:#e7f0ee;--mute:#92a6ab;--line:#25373d;--acc:#2dd4bf;--accl:#12302e;--card:#142329;--col:#0f1e23;--onacc:#06231f;--hov:#3d555c;--warnbg:#3a2b16;--warnfg:#f2c98f;--okbg:#14321d;--okfg:#8fd6a0;--danger:#ff8f80;--shade:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1a1f;--ink:#e7f0ee;--mute:#92a6ab;--line:#25373d;--acc:#2dd4bf;--accl:#12302e;--card:#142329;--col:#0f1e23;--onacc:#06231f;--hov:#3d555c;--warnbg:#3a2b16;--warnfg:#f2c98f;--okbg:#14321d;--okfg:#8fd6a0;--danger:#ff8f80;--shade:rgba(0,0,0,.6)}
a{color:var(--acc)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--onacc);font-size:15px}
nav{display:flex;gap:4px;margin-left:10px}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
nav button.on{background:var(--accl);color:var(--acc)}
.hr{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.btn.p:hover{filter:brightness(.92)}
.btn.s{padding:5px 10px;font-size:13px}.btn.d{color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:28px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:17px;margin:0 0 6px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero{display:flex;align-items:center;gap:22px;margin:4px 0 20px}
.big{font-size:92px;font-weight:800;line-height:1;color:var(--acc);letter-spacing:-.05em}
.pipe{display:flex;height:14px;gap:3px}.pipe i{display:block;border-radius:5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin:16px 0 28px}
.legend div{display:flex;align-items:center;gap:8px;cursor:pointer}.legend span{width:10px;height:10px;border-radius:50%}
.nx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.nx:first-of-type{border-top:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:14px}
.col{background:var(--col);border-radius:14px;padding:12px;min-height:220px}
.col h3{margin:2px 4px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.col h3 span.dot{width:10px;height:10px;border-radius:50%}.col h3 em{margin-left:auto;font-style:normal;color:var(--mute);font-weight:600}
.jc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.jc:hover{border-color:var(--hov);border-left-color:var(--c)}
.jc .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reason{margin-top:6px;font-size:13px;color:var(--warnfg);background:var(--warnbg);padding:6px 10px;border-radius:8px}
.ov{position:fixed;inset:0;background:var(--shade);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:32px 16px;z-index:20}.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:24px}.md.w{max-width:860px}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:7px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:14px;font-weight:500}.chip:hover{border-color:var(--hov)}.chip.on{background:var(--accl);border-color:var(--acc);color:var(--acc);font-weight:700}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 16px;border-radius:99px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.paper{background:#fff;border:1px solid var(--line);box-shadow:0 8px 28px rgba(16,34,42,.1);padding:38px 42px;max-width:640px;margin:0 auto;font:13px/1.5 Helvetica,Arial,sans-serif;color:#111;white-space:pre-line}
.paper h1{font-size:24px;margin:0}.paper .ct{color:#555;font-size:12px;margin-bottom:8px}.paper h4{margin:16px 0 6px;font-size:11px;letter-spacing:.06em;border-bottom:1px solid #ccc;padding-bottom:3px}.paper ul{margin:4px 0 8px;padding-left:18px}.paper p{margin:0 0 10px}
.step{display:flex;gap:10px;align-items:center;margin-top:20px;font-weight:700}
.step i{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--accl);color:var(--acc);font-style:normal;font-size:13px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.note{background:var(--warnbg);color:var(--warnfg);padding:8px 12px;border-radius:8px;margin:0 0 14px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}.toast.on{opacity:1;transform:translate(-50%,0)}
.paper.t1{padding:0;font-family:Georgia,'Times New Roman',serif;color:#222}
.t1 .band{background:#465a68;color:#fff;padding:24px 30px;text-align:center}.t1 .nm{display:block;font-size:26px;font-weight:700}.t1 .hl{display:block;font-size:14px;margin-top:3px}.paper.t1 .ct{color:#fff;font-size:11.5px;margin:8px 0 0}
.t1 .pb{padding:4px 30px 30px}.paper.t1 h4{color:#465a68;font-size:16px;letter-spacing:0;margin:18px 0 8px;border-bottom:1px solid #465a68;padding-bottom:3px}
.t1 .sk div{margin-bottom:5px;font-size:11.5px}.t1 .sk b{color:#465a68;font-size:12px}
.t1 .rw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:8px}.t1 ul{list-style:none;padding:0;margin:2px 0 6px}.t1 li{font-size:11.5px;padding-left:9px;text-indent:-9px}.t1 li:before{content:'- '}
.paper.t2{font-family:'Times New Roman',Times,serif}
.t2 .hd{text-align:center}.t2 .nm{font-size:30px;font-weight:700;color:#14286e}.t2 .hl{color:#555;font-size:15px}.t2 .ct{font-size:12px;margin:6px 0 8px;padding-bottom:10px;border-bottom:1.5px solid #111}
.paper.t2 h4{font-size:17px;letter-spacing:.04em;color:#14286e;border-bottom:1px solid #ddd;margin:16px 0 8px;padding-bottom:4px}
.t2 p{font-size:12px;margin:0 0 7px}.t2 b.g{color:#14286e;font-size:13px}.t2 .rt{font-weight:700;font-size:13px;margin-top:8px}.t2 .rc{font-size:12.5px;color:#333}.t2 ul{margin:3px 0 8px;padding-left:20px}.t2 li{font-size:12px}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}#lock.on{display:flex}#lock .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:380px;width:100%;text-align:center}body.locked header,body.locked main{visibility:hidden}body.locked #ov,body.locked #toast{display:none!important}
#lock .logo{margin:0 auto 14px}#lock .err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}
.sec{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
details{margin-top:14px}summary{cursor:pointer;font-weight:600;color:var(--acc)}
.kw{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0 14px}.kwh{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;margin-bottom:10px}
.kc{font-size:13px;padding:4px 10px;border-radius:99px;font-weight:600}.kc.ok{background:var(--okbg);color:var(--okfg)}.kc.no{background:var(--warnbg);color:var(--warnfg)}
.exn{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;font-size:14px;margin-bottom:20px}
@media(max-width:640px){.g2{grid-template-columns:1fr}header{padding:10px 16px}main{padding:16px}.big{font-size:64px}.paper{padding:22px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>
<script>try{if(localStorage.getItem('wat.lock'))document.body.classList.add('locked')}catch(e){}</script>
<header><div class="brand"><span class="logo">W</span>Work Application Tracker</div><nav id="nav"></nav>
<div class="hr"><button class="btn" id="lk" onclick="lockUi()"></button><button class="btn" id="ai" onclick="aiUi()"></button><button class="btn" id="sy" onclick="syncUi()"></button><button class="btn" id="th" onclick="toggleTheme()"></button><button class="btn" id="who" onclick="people()"></button><button class="btn" onclick="exportData()">Export backup</button><label class="btn">Import<input type="file" id="imp" hidden accept=".json"></label><button class="btn p" onclick="addJob()">Add job</button></div></header>
<main id="main"></main>
<div id="ov" class="ov" onclick="if(event.target===this)closeM()"><div id="md" class="md"></div></div>
<div id="toast" class="toast"></div>
<div id="lock"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='wat.v2',ST=[['todo','To apply'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['rejected','Rejected'],['skipped','Not applying']];
const COL={todo:'#8fa1a6',applied:'#0f766e',interview:'#2f6fdc',offer:'#3f9f3f',rejected:'#c2410c',skipped:'#c9d1cf'};
const REASONS=['Salary too low','Not a good fit','Location or remote policy','Visa or work permit','Position closed','Found a better role','Other'];
const blank=()=>({profile:{name:'',headline:'',email:'',phone:'',location:'',links:'',summary:'',skills:'',education:[],experience:[]},jobs:[]});
/* Inside the Claude artifact viewer, downloads and AI go through window.claude; a saved copy of this file has no window.claude */
const VIEW=!!(window.claude&&typeof window.claude.use==='function');
const safeUrl=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''};
let R;try{R=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!R){let o;try{o=JSON.parse(localStorage.getItem('wat.v1'))}catch(e){}R=o?{active:'p1',people:[{id:'p1',name:'Me',data:o}]}:{active:'ex',people:[{id:'ex',name:'Example',data:example()}]}}
let S=R.people.find(p=>p.id===R.active).data;
let view=(!S.profile.name&&!S.jobs.length)?'prof':'dash',ptab='Personal',cur=null,pv='resume',reason='';
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const persist=()=>{R.rev=Date.now();store();push()};
const save=()=>{persist();render()};
const J=id=>S.jobs.find(j=>j.id===id),cnt=s=>S.jobs.filter(j=>j.status===s).length;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)};
const openM=(h,w)=>{$('#md').className='md'+(w?' w':'');$('#md').innerHTML=h;$('#ov').classList.add('on');$('#ov').scrollTop=0};
const closeM=()=>{$('#ov').classList.remove('on');render()};
const go=v=>{view=v;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

function render(){
 $('#who').textContent='Profile: '+R.people.find(p=>p.id===R.active).name;
 $('#nav').innerHTML=[['dash','Dashboard'],['jobs','Jobs'],['prof','My profile']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#main').innerHTML=exNote()+(view==='dash'?dash():view==='jobs'?board():prof());
}
const exNote=()=>R.active==='ex'?`<div class="note exn"><span>This is an example profile with made-up jobs, so you can try every feature. Nothing here is real.</span><button class="btn s" onclick="people()">Add my own profile</button></div>`:'';

/* ---------- Dashboard ---------- */
function dash(){
 const tot=S.jobs.length,applied=tot-cnt('todo')-cnt('skipped'),wk=S.jobs.filter(j=>j.appliedAt&&Date.now()-new Date(j.appliedAt)<6048e5).length;
 const next=S.jobs.filter(j=>j.status==='todo').slice(0,5);
 return `<div class="hero"><div class="big">${cnt('todo')}</div><div><h1>jobs still to apply for</h1><div class="mute">You have applied to ${applied} so far, ${wk} in the last 7 days, and skipped ${cnt('skipped')}.</div></div></div>
 <div class="pipe">${tot?ST.map(([k])=>cnt(k)?`<i style="flex:${cnt(k)};background:${COL[k]}"></i>`:'').join(''):'<i style="flex:1;background:var(--line)"></i>'}</div>
 <div class="legend">${ST.map(([k,l])=>`<div onclick="go('jobs')"><span style="background:${COL[k]}"></span><b>${cnt(k)}</b> ${l}</div>`).join('')}</div>
 <div class="card"><h2>Up next</h2>${next.length?next.map(j=>`<div class="nx"><div><b>${esc(j.title)}</b><div class="mute">${esc(j.company)}</div></div><button class="btn s p" onclick="openJob('${j.id}')">Open</button></div>`).join(''):'<div class="mute">No jobs waiting. Select Add job to paste your first job description.</div>'}</div>`;
}

/* ---------- Jobs board ---------- */
function board(){
 return `<h1>Jobs</h1><div class="mute" style="margin-bottom:18px">${cnt('todo')} available to apply for, ${cnt('applied')} applied.</div><div class="board">${ST.map(([k,l])=>{const js=S.jobs.filter(j=>j.status===k);return `<div class="col"><h3><span class="dot" style="background:${COL[k]}"></span>${l}<em>${js.length}</em></h3>${js.map(card).join('')||'<div class="mute" style="padding:6px;font-size:13px">Nothing here yet</div>'}</div>`}).join('')}</div>`;
}
const card=j=>`<div class="jc" style="--c:${COL[j.status]}" onclick="openJob('${j.id}')"><b>${esc(j.title)}</b><div class="mute">${esc(j.company)}</div>${j.status==='skipped'?`<div class="reason">${esc(j.reason)}</div>`:''}<div class="row" onclick="event.stopPropagation()">${safeUrl(j.link)?`<a class="btn s" href="${esc(safeUrl(j.link))}" target="_blank" rel="noopener">Open link</a>`:''}${j.cover?`<button class="btn s" onclick="dl('${j.id}','resume')">Resume PDF</button><button class="btn s" onclick="dl('${j.id}','cover')">Cover letter PDF</button>`:''}${j.status==='todo'?`<button class="btn s p" onclick="setSt('${j.id}','applied')">Mark applied</button><button class="btn s" onclick="skip('${j.id}')">Not applying</button>`:''}</div></div>`;

function setSt(id,st){const j=J(id);j.status=st;if(st==='applied')j.appliedAt=new Date().toISOString();if(st!=='skipped')j.reason='';save();toast('Moved to '+ST.find(s=>s[0]===st)[1])}
const chg=(id,v)=>v==='skipped'?skip(id):setSt(id,v);

/* ---------- Not applying dialog ---------- */
function skip(id){reason='';const j=J(id);openM(`<h2>Why are you not applying?</h2><div class="mute">${esc(j.title)} at ${esc(j.company)}</div><div class="chips" style="margin-top:16px">${REASONS.map(r=>`<span class="chip" tabindex="0" onclick="pick(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(this)}">${r}</span>`).join('')}</div><label class="f">More detail (optional)</label><textarea id="rn" placeholder="Add a note for yourself"></textarea><div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="confirmSkip('${id}')">Move to Not applying</button></div>`)}
const pick=el=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');reason=el.textContent};
function confirmSkip(id){const r=[reason,$('#rn').value.trim()].filter(Boolean).join(': ');if(!r)return toast('Pick a reason or write one');const j=J(id);j.status='skipped';j.reason=r;save();closeM();toast('Moved to Not applying')}

/* ---------- In-page confirmations (the artifact viewer blocks confirm and prompt) ---------- */
let askFn=null;
function ask(title,body,ok,fn,danger){askFn=fn;openM(`<h2>${esc(title)}</h2>${body?`<div class="mute">${esc(body)}</div>`:''}<div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn ${danger?'d':'p'}" onclick="const f=askFn;askFn=null;f&&f()">${esc(ok)}</button></div>`)}

function delJob(id){const j=J(id);ask('Delete this job?',j.title+(j.company?' at '+j.company:'')+'. Its tailored resume and cover letter are deleted too.','Delete job',()=>{S.jobs=S.jobs.filter(x=>x.id!==id);save();closeM();toast('Job deleted')},true)}

/* ---------- AI prompt in, JSON out ---------- */
const lines=t=>(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const groups=x=>{if(typeof x==='string')x=x.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':');return i>0&&i<60?{group:l.slice(0,i).trim(),items:l.slice(i+1).split(',').map(s=>s.trim()).filter(Boolean)}:{group:'',items:l.split(',').map(s=>s.trim()).filter(Boolean)}});if(!Array.isArray(x))return[];if(x.length&&typeof x[0]==='string')return[{g:'',items:x}];return x.map(o=>({g:o.group||o.g||'',items:o.items||[]}))};
const master=()=>{const p=S.profile;return{name:p.name,headline:p.headline||'',summary:p.summary,skills:groups(p.skills).map(x=>({group:x.g,items:x.items})),education:p.education,experience:p.experience.map(e=>({role:e.role,company:e.company,industry:e.ind||'',location:e.loc||'',dates:e.dates,bullets:lines(e.bullets)}))}};

/* ---------- Documents ---------- */
function resume(j){const p=S.profile,m=master(),r=j.resume||{},o=x=>x||'';return{tpl:j.tpl||'andrew',name:p.name||'Your name',headline:r.headline||p.headline||'',parts:[p.email,p.phone,p.location,p.links].filter(Boolean),summary:r.summary||m.summary,skills:groups(r.skills||m.skills),education:p.education.map(e=>({school:o(e.school),degree:o(e.degree),major:o(e.major),years:o(e.years)})),experience:(r.experience||m.experience).map(e=>({role:o(e.role),company:o(e.company),location:o(e.location),dates:o(e.dates),bullets:e.bullets||[]}))}}
const coverText=j=>j.cover||'Dear Hiring Manager,\n\nYour tailored cover letter will appear here once you paste the AI reply.';
const edu=e=>[[e.degree,e.major].filter(Boolean).join(' in '),e.school].filter(Boolean).join(', ');
const fname=j=>[j.title,j.company].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]/g,'').trim()||'Job';
const today=()=>new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const clean=s=>String(s==null?'':s).replace(/[\u2010-\u2012\u2212\u2043]/g,'-').replace(/[\u00a0\u2002-\u200a\u202f\u205f\u3000]/g,' ').replace(/[\u00ad\u200b-\u200d\u2060\ufeff]/g,'').replace(/\u2192/g,'->').replace(/\u2248/g,'~').replace(/\u2032/g,"'").replace(/\u2033/g,'"').replace(/[^\u0000-\u00ff\u2013\u2014\u2018\u2019\u201a\u201c\u201d\u201e\u2020\u2021\u2022\u2026\u2030\u2039\u203a\u20ac\u2122\u0152\u0153\u0160\u0161\u0178\u017d\u017e\u0192\u02c6\u02dc]/g,'');
const SL=[70,90,104],NV=[20,40,110],GR=[85,85,85];
const bl=e=>e.bullets.map(b=>`<li>${esc(b)}</li>`).join('');
function paperR(r){const g=r.skills,ed=r.education;

function pdf2(M,y0){const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'letter'}),W=612-2*M;let y=y0;const _t=d.text.bind(d),_s=d.splitTextToSize.bind(d),_g=d.getTextWidth.bind(d);d.text=(t,x,yy,o)=>_t(Array.isArray(t)?t.map(clean):clean(t),x,yy,o);d.splitTextToSize=(t,w,o)=>_s(clean(t),w,o);d.getTextWidth=t=>_g(clean(t));

/* ---------- Cloud sync (Supabase) ---------- */
let SY=null,seen=0,pushT=null;try{SY=JSON.parse(localStorage.getItem('wat.sync'))}catch(e){}
const setSy=t=>{const b=$('#sy');if(b)b.textContent='Sync: '+t};
const rpc=(fn,body)=>{const h={'Content-Type':'application/json',apikey:SY.key};if(/^eyJ/.test(SY.key))h.Authorization='Bearer '+SY.key;return fetch(SY.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(t=>t?JSON.parse(t):null)};
const empty=d=>d.people.every(p=>p.id==='ex'||(!p.data.jobs.length&&!p.data.profile.name));
function adopt(d){const a=R.active;R=d;R.active=R.people.find(p=>p.id===a)?a:R.people[0].id;S=R.people.find(p=>p.id===R.active).data;seen=R.rev||0;store();render()}
function merge(a,b){const o=JSON.parse(JSON.stringify(b));a.people.forEach(p=>{const q=o.people.find(x=>x.id===p.id);if(!q)o.people.push(p);else p.data.jobs.forEach(j=>{if(!q.data.jobs.some(x=>x.id===j.id))q.data.jobs.unshift(j)})});o.rev=Date.now();return o}
function push(){if(!SY)return;setSy('Saving');clearTimeout(pushT);pushT=setTimeout(async()=>{try{const d=await rpc('get_ws',{p_code:SY.code});if(d&&d.people&&(d.rev||0)>seen)adopt(merge(R,d));await rpc('save_ws',{p_code:SY.code,p_data:R});seen=R.rev||0;setSy('Synced')}catch(e){setSy('Offline')}},700)}
async function pull(){if(!SY)return;const el=document.activeElement;if(el&&/INPUT|TEXTAREA/.test(el.tagName))return;try{const d=await rpc('get_ws',{p_code:SY.code});if(!d||!d.people){push();return}if((d.rev||0)>(R.rev||0))adopt(d);setSy('Synced')}catch(e){setSy('Offline')}}
async function connect(str){try{const o=JSON.parse(atob(str.trim()));if(!o.u||!o.k||!o.c)throw 0;SY={url:o.u,key:o.k,code:o.c};localStorage.setItem('wat.sync',JSON.stringify(SY));setSy('Connecting');const d=await rpc('get_ws',{p_code:SY.code});if(!d||!d.people)push();else if(empty(R))adopt(d);else{adopt(merge(R,d));push()}closeM();toast('Sync connected')}catch(e){SY=null;try{localStorage.removeItem('wat.sync')}catch(x){}setSy('Off');toast('Could not connect. Check the sync code and the Supabase setup.')}}
function makeWs(){const u=$('#su').value.trim(),k=$('#sk').value.trim();if(!/^https?:\/\//.test(u)||!k)return toast('Enter your Supabase URL and public key');const c=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');connect(btoa(JSON.stringify({u:u,k:k,c:c})))}

/* ---------- Resume reader (works without AI) ---------- */
const BUL=/^[-•–·▪●*]\s*/;
const MONR=/(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*\d{4}/i;
const DT='(?:'+MONR.source+'|\\d{1,2}\\/\\d{4}|\\d{4})';
const DR=new RegExp(DT+'\\s*(?:[–—-]|to)\\s*(?:'+DT+'|present|current|now)','i');
function headKey(t){const s=t.replace(/[:\s]+$/,'').toLowerCase();
 if(/^(professional |career )?(summary|profile|objective)$|^about me$/.test(s))return'summary';
 if(/^(technical |core |key )?(skills|competencies)$|^technologies$|^skills (&|and) .*$/.test(s))return'skills';
 if(/^(professional |work |relevant )?(experience|employment( history)?|work history)$/.test(s))return'exp';
 if(/^education( (&|and) training)?$/.test(s))return'edu';
 if(/^(certifications?|projects?|awards|achievements|publications|languages|interests|references|volunteer.*|training)$/.test(s))return'other';
 return''}
function toLines(pages){const L=[];pages.forEach(pg=>{const its=pg.slice().sort((a,b)=>b.y-a.y||a.x-b.x),rows=[];let cur=null;
 for(const t of its){if(cur&&Math.abs(cur.y-t.y)<=2.5)cur.it.push(t);else{cur={y:t.y,it:[t]};rows.push(cur)}}
 rows.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);const segs=[];let last=null;
  for(const t of r.it){const gap=last?t.x-(last.x+last.w):0;
   if(last&&gap<=12&&Math.abs(t.z-last.z)<2.2){const sp=gap>1&&!/\s$/.test(last.s)&&!/^\s/.test(t.s)?' ':'';segs[segs.length-1].t+=sp+t.s}
   else segs.push({x:t.x,t:t.s,z:t.z});last=t}
  const ss=segs.map(s=>({x:s.x,z:s.z,t:s.t.replace(/[\uE000-\uF8FF\u00A0]/g,' ').replace(/\s+/g,' ').trim()})).filter(s=>s.t);
  if(ss.length)L.push({segs:ss,text:ss.map(s=>s.t).join(' '),x:ss[0].x})})});return L}
const textLines=t=>t.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean).map(s=>({segs:[{x:0,z:10,t:s}],text:s,x:0}));
function parseSkills(L){const segs=[];L.forEach(l=>l.segs.forEach(s=>segs.push(s)));
 const cols=segs.some(s=>s.x>=300)?[segs.filter(s=>s.x<300),segs.filter(s=>s.x>=300)]:[segs],gs=[];
 cols.forEach(c=>{const tx=c.map(s=>s.t),colon=tx.some(t=>/^[^:,]{2,50}:/.test(t));let cur=null;
  tx.forEach(t=>{const m=t.match(/^([^:,]{2,50}):\s*(.*)$/),add=s=>{cur.t+=(cur.t&&!/[a-z]-$/.test(cur.t)?' ':'')+s};
   if(colon){if(m){cur={g:m[1].trim(),t:m[2]};gs.push(cur)}else if(cur)add(t);else{cur={g:'',t};gs.push(cur)}}
   else{if(t.length<=45&&!/[,.;]$/.test(t)&&!t.includes(',')){cur={g:t,t:''};gs.push(cur)}else if(cur)add(t);else{cur={g:'',t};gs.push(cur)}}})});
 return gs.map(x=>(x.g?x.g+': ':'')+x.t.split(/,\s*/).map(s=>s.trim()).filter(Boolean).join(', ')).join('\n')}
function parseExp(L){const isB=t=>BUL.test(t),idx=[];L.forEach((l,i)=>{if(!isB(l.text)&&DR.test(l.text))idx.push(i)});
 const info=idx.map((i,k)=>{const t=L[i].text,m=t.match(DR),before=t.slice(0,m.index).replace(/[\s(|,–—-]+$/,'').trim(),after=t.slice(m.index+m[0].length).replace(/^[\s)|,•·–—-]+/,'').replace(/[\s)]+$/,'').trim();
  const p=i-1>(k?idx[k-1]:-1)?L[i-1].text:'',title=!before.includes(',')&&p&&!isB(p)&&p.length<=70&&!/[.;,]$/.test(p)&&/^[A-Z0-9]/.test(p)&&p.split(' ').length<=9;
  let role='',company='';
  if(title){role=p;company=before}
  else if(/\s(?:at|@)\s/i.test(before)){const q=before.split(/\s(?:at|@)\s/i);role=q[0];company=q.slice(1).join(' at ')}
  else{const q=before.split(/,\s*/);company=q[0];role=q.slice(1).join(', ')}
  return{i,start:title?i-1:i,role:role.trim(),company:company.trim(),loc:after,dates:m[0].trim()}});
 return info.map((e,k)=>{const end=k+1<info.length?info[k+1].start:L.length,blk=L.slice(e.i+1,end),any=blk.some(l=>isB(l.text)),bs=[];
  blk.forEach(l=>{const c=l.text.replace(BUL,'');if(isB(l.text)||!bs.length||(!any&&/[.;]$/.test(bs[bs.length-1])))bs.push(c);else bs[bs.length-1]+=(/[a-z]-$/.test(bs[bs.length-1])?'':' ')+c});
  return{role:e.role,company:e.company,loc:e.loc,dates:e.dates,bullets:bs.join('\n')}})}
function parseEdu(L){const out=[],YR=/\b(?:19|20)\d{2}\b/;let buf=[];
 const fin=(txt,yr)=>{const ps=txt.split(/,\s*/).map(s=>s.trim()).filter(Boolean);if(!ps.length)return;let degree='',major='';
  if(ps.length===2){const m=ps[1].match(/^(.*?)\s+in\s+(.*)$/i);if(m){degree=m[1];major=m[2]}else degree=ps[1]}else if(ps.length>2){degree=ps[1];major=ps.slice(2).join(', ')}
  out.push({school:ps[0],degree,major,years:yr})};
 L.forEach(l=>{const t=l.text;if(DR.test(t)||YR.test(t)){const m=t.match(DR)||t.match(YR),yr=m[0].trim(),rest=t.replace(m[0],'').replace(/^[\s|,–—-]+|[\s|,–—-]+$/g,'').trim();fin([...buf,rest].filter(Boolean).join(', '),yr);buf=[]}else buf.push(t)});
 if(buf.length)fin(buf.join(', '),'');return out}
function parseResume(L){
 const o={name:'',headline:'',email:'',phone:'',location:'',links:'',summary:'',skills:'',education:[],experience:[]};
 const isH=l=>l.segs.length===1&&l.text.length<=40&&headKey(l.text);
 let f=L.findIndex(isH);if(f<0)f=Math.min(L.length,5);
 const head=L.slice(0,f);let skipLine1=false;
 if(head.length){const h=head[0],bad=t=>/@|https?:|www\.|\d{3}[\s.)-]*\d{3,4}/.test(t);o.name=h.segs[0].t;
  if(h.segs.length>1&&!bad(h.segs[1].t))o.headline=h.segs[1].t;
  else if(head[1]&&!bad(head[1].text)){o.headline=head[1].text;skipLine1=true}}
 const pieces=[];head.forEach((l,i)=>l.segs.forEach((s,j)=>{if(i===0&&j===0)return;if(i===0&&j===1&&o.headline===s.t)return;if(i===1&&skipLine1)return;pieces.push(s.t)}));
 const all=pieces.join(' | ');
 o.email=(all.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/)||[''])[0];
 o.phone=(all.match(/\+?\(?\d[\d\s().-]{7,}\d/)||[''])[0].trim();
 const lk=all.match(/(?:https?:\/\/|www\.)[^\s|]+|(?:linkedin|github)\.com\/[^\s|]+/gi)||[];o.links=lk.join(' ');
 let rem=all;[o.email,o.phone,...lk].forEach(x=>{if(x)rem=rem.split(x).join(' | ')});
 for(const p of rem.split(/\s*[|•·]\s*/)){const q=p.trim();if(/^[A-Za-z.'’ -]+,\s*[A-Za-z. ]{2,}$/.test(q)){o.location=q;break}}
 const sec={summary:[],skills:[],exp:[],edu:[],other:[]};let k='';
 L.slice(f).forEach(l=>{const h=isH(l);if(h){k=h;return}if(k&&sec[k])sec[k].push(l)});
 o.summary=sec.summary.map(l=>l.text).join(' ');
 o.skills=parseSkills(sec.skills);o.experience=parseExp(sec.exp);o.education=parseEdu(sec.edu);
 return o}
function pdfSetup(){if(window.pdfjsLib&&!pdfjsLib.GlobalWorkerOptions.workerSrc)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
async function pdfItems(buf){if(!window.pdfjsLib)throw new Error('the PDF reader did not load, check your internet connection');pdfSetup();const pdf=await pdfjsLib.getDocument({data:buf}).promise,pages=[];for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();pages.push(c.items.filter(t=>t.str&&t.str.trim()!=='').map(t=>({s:t.str,x:t.transform[4],y:t.transform[5],z:Math.hypot(t.transform[0],t.transform[1])||t.height,w:t.width})))}return pages}
async function fileLines(f){return /\.pdf$/i.test(f.name)?toLines(await pdfItems(await f.arrayBuffer())):textLines(await f.text())}
async function fillFrom(inp){const f=inp.files[0];inp.value='';if(!f)return;toast('Reading the resume');try{applyParsed(await fileLines(f))}catch(e){toast('Could not open that file: '+(e&&e.message?e.message:e))}}
function applyParsed(L){if(!L.length)return toast('No text found. If the PDF is a scan, use Paste text instead.');const d=parseResume(L);if(!d.name&&!d.experience.length)return toast('Could not find resume sections. Try Fill with AI.');const P=S.profile,fill=()=>{Object.assign(P,d);save();closeM();ptab='Personal';render();toast('Filled in '+d.experience.length+' jobs and '+d.education.length+' education entries. Check each tab.')};if(P.name||P.experience.length||P.education.length)return ask('Replace the details in this profile?','The resume replaces your personal details, skills, education and experience. Your jobs stay.','Replace details',fill);fill()}

const tcase=s=>s.replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b[a-z]/g,c=>c.toUpperCase());
function guessJob(link,jd){let title=(jd.split('\n').map(s=>s.trim()).find(Boolean)||'').slice(0,80);if(title.length>=80||/[.!?]$/.test(title))title='';let company='';
 try{const u=new URL(link),h=u.hostname.replace(/^www\./,'').toLowerCase(),seg=u.pathname.split('/').filter(Boolean);let raw='';
  const sub=h.match(/^([a-z0-9-]+)\.(?:recruitee\.com|teamtailor\.com|jobs\.personio\.(?:de|com)|bamboohr\.com|breezy\.hr|workable\.com|wd\d+\.myworkdayjobs\.com|zohorecruit\.\w+|factorialhr\.\w+)$/);
  if(/^(job-boards\.(eu\.)?greenhouse\.io|boards\.(eu\.)?greenhouse\.io|jobs\.(eu\.)?lever\.co|jobs\.ashbyhq\.com|apply\.workable\.com|(jobs|careers)\.smartrecruiters\.com)$/.test(h))raw=seg[0]||'';
  else if(h==='join.com'&&seg[0]==='companies')raw=seg[1]||'';
  else if(sub)raw=sub[1];
  else if(!/(^|\.)(linkedin|indeed|glassdoor|stepstone|xing|monster|welcometothejungle|totaljobs|reed|google|jobteaser|infojobs|pracuj|jobs)\.[a-z.]+$/.test(h)){const ps=h.split('.');let i=ps.length-2;if(i>0&&/^(co|com|org|net|ac|gov)$/.test(ps[i]))i--;raw=i>0&&/^(careers?|jobs|apply|work|join|karriere|emploi|empleo|lavoro|werkenbij)$/.test(ps[i])?'':ps[i]||'';if(!raw&&ps.length>1)raw=ps[1]}
  company=raw?tcase(decodeURIComponent(raw)):''}catch(e){}
 if(!company){const m=jd.match(/^\s*(?:company|employer|unternehmen|entreprise|empresa|azienda)\s*:\s*(.{2,60})$/im)||jd.match(/^\s*[Aa]bout\s+(?!(?:Us|You|The)\b)([A-Z][\w&.'’-]*(?:\s+[A-Z][\w&.'’-]*){0,3})\s*$/m)||jd.match(/^\s*([A-Z][\w&.'’-]*(?:\s+[A-Z][\w&.'’-]*){0,3})\s+(?:is|builds|makes|creates|develops)\b/m);if(m)company=m[1].trim()}
 if(!title){const m=jd.match(/^\s*(?:job title|position|role|title)\s*:\s*(.{2,80})$/im);if(m)title=m[1].trim()}
 return{title,company}}
const fixLink=u=>{u=String(u||'').trim();return !u?'':/^https?:\/\//i.test(u)?u:/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)?'https://'+u:''};

 </div>

 <div class="ft" style="justify-content:space-between"><button class="btn d" onclick="delJob('${id}')">Delete job</button><span style="display:flex;gap:8px;flex-wrap:wrap">${j.cover?`<button class="btn" onclick="clearTl('${id}')">Clear tailoring</button>`:''}<button class="btn" onclick="closeM()">Close</button><button class="btn p" onclick="preview('${id}')">Preview and download</button></span></div>`,true);

/* ---------- Tailoring ---------- */
let AIS={key:'',model:'gemini-2.5-flash'};try{Object.assign(AIS,JSON.parse(localStorage.getItem('wat.ai'))||{})}catch(e){}
let CL=null;if(VIEW)claude.use('sample').then(x=>{CL=x;aiLabel()}).catch(()=>{});
const aiName=()=>CL?'Claude':!VIEW&&AIS.key?'Gemini':'';
const aiLabel=()=>{$('#ai').textContent='AI: '+(aiName()||'Copy and paste')};
function tailorPrompt(j){const m=master();delete m.education;return `Tailor my resume and write a cover letter for the job below.

Rules:
- Use only facts from MY PROFILE and EXTRA DETAILS. Never invent employers, job titles, dates, degrees, numbers, tools or achievements.
- Rewrite the bullets of each job in my profile so they match the job description. Keep every number that is in the original. You may reorder, merge or drop bullets, and you may add a bullet from EXTRA DETAILS when it is true and relevant.
- Where I really have a skill or tool the job description asks for, use the job description's own words for it, so an ATS can match them.
- "experience" must have exactly ${m.experience.length} entries, in the same order as in my profile. Each entry holds only the new bullets for that job.
- Keep the summary to 2 or 3 sentences and the headline to a few words.
- The cover letter has 3 or 4 short paragraphs, starts with "Dear Hiring Manager," and ends with "Kind regards," and my name on its own line. Write plainly, with no placeholders in square brackets.

Return ONLY valid JSON (no markdown) in exactly this shape:
{"headline":"","summary":"","skills":[{"group":"","items":[""]}],"experience":[{"bullets":[""]}],"cover":""}

MY PROFILE:
${JSON.stringify(m,null,1)}

EXTRA DETAILS (true, but not on my resume):
${S.profile.notes||'(none)'}

JOB: ${j.title}${j.company?' at '+j.company:''}
JOB DESCRIPTION:
${String(j.jd||'').slice(0,20000)}`}
function parseReply(t){t=String(t||'').replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('no json');return JSON.parse(t.slice(a,b+1))}
/* Titles, companies, locations and dates are copied from the profile; only bullets come from the AI */
function applyTailor(j,d){if(!d||typeof d!=='object'||!(d.summary||d.cover||Array.isArray(d.experience)))throw new Error('shape');
 const s=x=>String(x==null?'':x).trim(),m=master(),r={};
 if(s(d.headline))r.headline=s(d.headline);if(s(d.summary))r.summary=s(d.summary);
 const sk=groups(d.skills||[]).map(g=>({group:s(g.g),items:(Array.isArray(g.items)?g.items:String(g.items).split(',')).map(s).filter(Boolean)})).filter(g=>g.items.length);if(sk.length)r.skills=sk;
 r.experience=m.experience.map((e,i)=>{const x=(d.experience||[])[i],bs=(x&&Array.isArray(x.bullets)?x.bullets:[]).map(s).filter(Boolean);return{role:e.role,company:e.company,location:e.location,dates:e.dates,bullets:bs.length?bs:e.bullets}});
 j.resume=r;j.cover=s(d.cover)||j.cover||'';j.tailoredAt=new Date().toISOString();persist()}
async function gemini(prompt){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(AIS.model||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':AIS.key},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.4}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error&&d.error.message||'Gemini answered '+r.status);const ps=(((d.candidates||[])[0]||{}).content||{}).parts||[];return parseReply(ps.map(x=>x.text||'').join(''))}

 genBusy=true;const b=$('#gen');if(b){b.disabled=true;b.textContent='Generating with '+how+'. This can take a minute'}
 try{const d=how==='Claude'?await CL.json(tailorPrompt(j),{modelTier:'default'}):await gemini(tailorPrompt(j));applyTailor(j,d);render();toast('Tailored with '+how);if(cur===id&&$('#ov').classList.contains('on'))preview(id)}
 catch(e){const c=e&&e.code;if(c==='not_granted'||c==='sampling_disabled'){CL=null;aiLabel();toast('Claude is not allowed for this page. Use Copy AI prompt instead')}else if(c==='rate_limited')toast('Too many requests. Wait a minute and try again');else if(c==='invalid_json'||(e&&/json|shape/i.test(e.message||'')))toast('The AI answer was not in the right shape. Try again');else toast('Could not generate: '+(e&&e.message||'unknown error'))}

/* ---------- ATS keyword check ---------- */
const STOP=new Set(("a an and are as at be been being but by can could do does for from has have having he her his i if in into is it its of on or our ours she so than that the their them then there these they this those to too us was we were what when where which while who whom why will with within without would you your yours "+
 "about above across after again against all also am any around because before below between both each few further here how just more most no nor not now off once only other out over own same some such through under until up very via well "+
 "able ability work working works job jobs role roles position team teams company companies candidate candidates opportunity opportunities experience experienced year years strong good great excellent skill skills knowledge understanding including include includes environment day days week weeks time full part based remote hybrid office benefits salary plus etc e.g i.e eu emea uk usa europe european new looking join apply help make makes making get use using used need needs want like love passionate every per one two three many much may might must should shall "+
 "build builds building built ship write writes improve own grow create develop developing development maintain support ensure deliver collaborate closely responsibilities requirements responsible required preferred nice bonus offer offers lead leading you'll we're you're").split(' '));
const esr=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const has=(t,k)=>{const f=w=>new RegExp('(^|[^a-z0-9])'+esr(w.toLowerCase())+'($|[^a-z0-9+#])').test(t);return f(k)||(k.length>4&&/s$/i.test(k)&&f(k.slice(0,-1)))};
function keywords(j){const jd=String(j.jd||''),lo=jd.toLowerCase(),c=new Map();if(!jd.trim())return[];
 (jd.match(/[A-Za-z][A-Za-z0-9+#./-]*[A-Za-z0-9+#]/g)||[]).forEach(w=>{w=w.replace(/[./-]+$/,'');const l=w.toLowerCase();if(l.length<2||STOP.has(l))return;const o=c.get(l)||{w,n:0,s:0};o.n++;if(/[A-Z]/.test(w.slice(1))||/[+#.\/]/.test(w))o.s=2;c.set(l,o)});
 groups(S.profile.skills).forEach(g=>g.items.forEach(it=>{const l=it.toLowerCase();if(l.length>1&&has(lo,it)){const o=c.get(l)||{w:it,n:1,s:0};o.s+=3;c.set(l,o)}}));
 return[...c.values()].map(o=>({w:o.w,v:o.n+o.s})).filter(o=>o.v>=2).sort((a,b)=>b.v-a.v).slice(0,18).map(o=>o.w)}
const resumeText=j=>{const r=resume(j);return[r.headline,r.summary,...r.skills.flatMap(g=>[g.g,...g.items]),...r.experience.flatMap(e=>[e.role,e.company,...e.bullets])].join('\n').toLowerCase()};
function kwPanel(j){const ks=keywords(j);if(!ks.length)return'';const t=resumeText(j),hit=new Set(ks.filter(k=>has(t,k))),pc=Math.round(100*hit.size/ks.length);
 return `<div class="kw"><div class="kwh"><b>ATS keyword check: ${pc}%</b><span class="mute">${hit.size} of ${ks.length} keywords from the job description are in ${j.cover?'the tailored resume':'your master resume'}</span></div><div class="chips">${ks.map(k=>`<span class="kc ${hit.has(k)?'ok':'no'}">${hit.has(k)?'✓':'–'} ${esc(k)}</span>`).join('')}</div>${pc<70?'<div class="mute" style="font-size:13px;margin-top:10px">Only add a missing keyword if it is true for you. Put it in your profile or extra details, then generate again.</div>':''}</div>`}

async function sha(s){s='wat:'+s;if(!(window.crypto&&crypto.subtle))return 'h'+[...s].reduce((h,c)=>(Math.imul(h,31)+c.charCodeAt(0))>>>0,7);return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
